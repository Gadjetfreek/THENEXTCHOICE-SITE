<!doctype html>
<html lang="ja">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="robots" content="noindex,nofollow,noarchive,nosnippet" /><title>ありがとうございます — The Next Choice</title><style>:root{color-scheme:dark;--bg:#0a0d0c;--panel:#151c18;--text:#f3f4ef;--muted:#aab3ac;--line:#344039}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;background:radial-gradient(circle at 50% 10%,rgba(111,150,126,.14),transparent 34rem),var(--bg);color:var(--text);display:grid;place-items:center}main{width:min(700px,calc(100% - 32px));padding:44px 0}.brand{font-family:Georgia,"Times New Roman",serif;font-size:1.25rem;margin-bottom:22px}.card{padding:clamp(28px,6vw,46px);background:radial-gradient(circle at 50% 0%,rgba(161,196,173,.12),transparent 24rem),var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:0 28px 90px rgba(0,0,0,.36)}h1{font-family:Georgia,"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(2.4rem,8vw,4rem);font-weight:400;letter-spacing:-.02em;margin:0 0 20px}p{color:#b8c2bb;line-height:1.9}.btn{display:inline-block;margin:14px 8px 0 0;border:1px solid #5a695f;border-radius:999px;padding:12px 18px;font:inherit;font-weight:650;cursor:pointer;text-decoration:none}.primary{background:var(--text);color:#101410;border-color:var(--text)}.secondary{background:rgba(255,255,255,.025);color:var(--text)}.status{margin-top:14px;color:var(--muted);font-size:.85rem}@media(max-width:520px){.card{padding:28px 20px;border-radius:20px}}</style></head>
<body><main><div class="brand">The Next Choice</div><div class="card"><h1>ありがとうございます。</h1><p>回答を送信しました。</p><p>よければ <em>The Next Choice</em> に戻るか、この体験をほかの人と共有してください。先に自分の感想を伝えず、その人自身にまっさらな状態で聞いてもらえるとうれしいです。</p><a class="btn secondary" href="../../../ja/">The Next Choice に戻る</a><button class="btn primary" type="button" onclick="shareTrial()">The Next Choice を共有</button><div id="status" class="status"></div></div></main><script>async function shareTrial(){const url=new URL('../',location.href).href;const data={title:'The Next Choice',text:'このストーリーを聞いて、5つの短い質問に答えてみませんか？',url};try{if(navigator.share){await navigator.share(data)}else{await navigator.clipboard.writeText(url);document.getElementById('status').textContent='リンクをコピーしました。'}}catch(e){}}</script></body></html>
